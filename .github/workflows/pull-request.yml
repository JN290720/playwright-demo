name: PR Test

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write # 💡 VRT画像のコミット ＆ レポート用gh-pages更新のため
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # =======================================================================
      # 💡 【初回限定】テスト実行前に正解画像（PC/スマホ）を自動生成してPush
      # =======================================================================
      - name: Generate VRT Snapshots (Initial Run)
        env:
          ENV: staging
        run: npx playwright test --grep "visual-regression" --update-snapshots

      - name: Commit & Push initial snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "tests/**/*-snapshots/*"
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(vrt): 初回実行によるPC/スマホのVRT正解画像自動追加 [skip ci]"
            git push
          fi
      # =======================================================================

      # 💡 画像が揃った状態で全テストを実行（ここでPASSEDになります）
      - name: Run Playwright tests
        id: run-tests
        env:
          ENV: staging
        run: npx playwright test

      # 💡 テスト結果（HTMLレポート）を GitHub Pages へデプロイ
      - name: Deploy Playwright Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: pr-reports/${{ github.event.number }}

      # PR画面へのテスト結果自動コメント
      - name: Comment PR with Test Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.run-tests.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED'; 
            const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-reports/${context.issue.number}/`; 

            const body = `### 🎭 Playwright Test Results (PR Check)\n` +
                         `**Status:** ${status}\n` +
                         `**PR Branch:** \`${context.payload.pull_request.head.ref}\` \n` +
                         `**📊 HTML Report:** [View Test Report](${reportUrl})`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const botComment = comments.find(c => c.body.includes('Playwright Test Results'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: body
              });
            }

      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-playwright-report
          path: playwright-report/
          retention-days: 7