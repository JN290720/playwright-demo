name: PR Test & VRT Update

on:
  pull_request:
    branches: [ main, master ]
  # PRコメントで /update-vrt が投稿された場合もトリガー（mainマージ後に有効化）
  issue_comment:
    types: [created]

permissions:
  contents: write      # レポート用gh-pages更新 ＆ VRT画像Commit用
  pull-requests: write # PRコメント追加・更新用
  issues: write        # issue_commentイベントでのコメント制御用

jobs:
  test:
    # PR作成・更新時、または PRに対する "/update-vrt" コメント投稿時に実行
    if: |
      github.event_name == 'pull_request' || 
      (github.event.issue.pull_request && contains(github.event.comment.body, '/update-vrt'))

    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      # 1. イベント種別（PR更新かコメントか）に応じて正しいPRブランチ名を動的に取得
      - name: Get PR Branch Name
        id: pr-branch
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              return pr.data.head.ref;
            }
            return context.payload.pull_request.head.ref;
          result-encoding: string

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-branch.outputs.result }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # =======================================================================
      # 💡 【事前更新ステップ】
      # 「/update-vrt コマンド時」または「未生成のスナップショットがある場合（初回）」に画像を撮影してPush
      # =======================================================================
      - name: Generate or Update VRT Snapshots
        env:
          ENV: staging
        run: npx playwright test --update-snapshots

      - name: Commit & Push updated snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # tests/ 配下の全変更（*-snapshots フォルダ含む）を確実にステージング
          git add -A tests/
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(vrt): PC/スマホ環境のVRTベースライン画像を自動更新 [skip ci]"
            git push
          else
            echo "No snapshot changes to commit."
          fi

      # -----------------------------------------------------------------------
      # 2. 全テスト実行（画像更新後、確実に最新画像と照合して検証）
      # -----------------------------------------------------------------------
      - name: Run Playwright tests
        id: run-tests
        env:
          ENV: staging
        run: npx playwright test

      # -----------------------------------------------------------------------
      # 3. レポート生成・コメントレスポンス関連
      # -----------------------------------------------------------------------
      
      # HTMLレポートを gh-pages へデプロイ
      - name: Deploy Playwright Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: pr-reports/${{ steps.pr-branch.outputs.result }}

      # PR画面へのテスト結果自動コメント
      - name: Comment PR Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const status = '${{ steps.run-tests.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED'; 
            const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-reports/${encodeURIComponent('${{ steps.pr-branch.outputs.result }}')}/`; 

            const body = `### 🎭 Playwright Test Results (PR Check)\n` +
                         `**Status:** ${status}\n` +
                         `**PR Branch:** \`${'${{ steps.pr-branch.outputs.result }}'}\` \n` +
                         `**📊 HTML Report:** [View Test Report](${reportUrl})\n\n` +
                         `---\n` +
                         `📸 **VRT画像を更新したい場合:**\n` +
                         `コメント欄に \`/update-vrt\` と投稿すると、Linux環境のPC/スマホ最新画像を自動更新してPushします。`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber
            });
            const botComment = comments.find(c => c.body.includes('Playwright Test Results'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber, body: body
              });
            }

      # アーティファクトの保存
      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-playwright-report
          path: playwright-report/
          retention-days: 7