name: PR Test

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write # 💡 レポート用gh-pages更新のために write に変更
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      id: run-tests
      run: npx playwright test

    # 💡 [追加] テスト結果（HTMLレポート）を GitHub Pages (gh-pages ブランチ) へ自動デプロイ
    # 成功・失敗を問わず常に実行され、PR番号ごとのフォルダに保存されます
    - name: Deploy Playwright Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: pr-reports/${{ github.event.number }} # PR番号ごとにディレクトリを分けて保存

    # PR画面へのテスト結果自動コメント
    - name: Comment PR with Test Status
      if: always()
      uses: actions/github-script@v9
      with:
        script: |
          const status = '${{ steps.run-tests.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED';
          // 💡 [追加] 該当PR専用のレポート閲覧用URLを生成
          const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-reports/${context.issue.number}/`;
          
          const body = `### 🎭 Playwright Test Results (PR Check)\n` +
                       `**Status:** ${status}\n` +
                       `**PR Branch:** \`${context.payload.pull_request.head.ref}\` \n` +
                       `**📊 HTML Report:** [View Test Report](${reportUrl})`;
          
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.find(c => c.body.includes('Playwright Test Results'));
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: body
            });
          }

    # テスト結果（HTMLレポート）の保存（成功・失敗問わず常に実行）
    - name: Upload Playwright Report Artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pr-playwright-report
        path: playwright-report/
        retention-days: 7