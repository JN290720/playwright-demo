name: PR Test & VRT Update

on:
  # PRが作成・更新（Push）された時に自動実行
  pull_request:
    branches: [ main, master ]
  # PRのコメント欄に新しいコメントが投稿された時に実行（/update-vrt 検知用）
  issue_comment:
    types: [created]

permissions:
  contents: write      # VRT更新画像のGit Commit & Push、およびHTMLレポート（gh-pages）のデプロイ権限
  pull-requests: write # PR画面へのステータスコメント投稿・更新権限
  issues: write        # issue_comment イベントでPRコメントおよびリアクションを操作するための権限

jobs:
  test:
    # -------------------------------------------------------------------------
    # 【実行条件の制御】
    # 1. 通常のPRイベント（作成・Push）時
    # 2. または、PRに対するコメント投稿であり、かつ本文に "/update-vrt" が含まれる時
    # ※無関係なIssueコメントや通常のPRコメントでの無駄なActions起動を防ぎます
    # -------------------------------------------------------------------------
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/update-vrt'))

    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # ステップ0: コメントへの受付スタンプ（👀 リアクション）付与
      # -----------------------------------------------------------------------
      - name: Add Eyes Reaction to Command Comment
        if: "github.event_name == 'issue_comment' && contains(github.event.comment.body, '/update-vrt')"
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      # -----------------------------------------------------------------------
      # ステップ1: 対象PRのブランチ名を動的に判別してチェックアウト
      # -----------------------------------------------------------------------
      - name: Get PR Branch Name
        id: pr-branch
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              return pr.data.head.ref;
            }
            return context.payload.pull_request.head.ref;
          result-encoding: string

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-branch.outputs.result }}

      # -----------------------------------------------------------------------
      # ステップ2: テスト実行環境のセットアップ（🚀 高速化キャッシュ対応）
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      # 💡 WebKit (Safari) 実行に必要なシステム依存ライブラリを含めてインストール
      - name: Install Playwright Browsers & Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # -----------------------------------------------------------------------
      # ステップ3-A: 【通常時】Playwright テストの実行
      # -----------------------------------------------------------------------
      - name: Run Playwright tests
        if: "!contains(github.event.comment.body, '/update-vrt')"
        id: run-tests
        env:
          ENV: staging
        run: npx playwright test

      # -----------------------------------------------------------------------
      # ステップ3-B: 【コマンド実行時】VRT（視覚テスト）スナップショット画像の自動更新
      # -----------------------------------------------------------------------
      - name: Update VRT Snapshots
        if: "contains(github.event.comment.body, '/update-vrt')"
        env:
          ENV: staging
        run: npx playwright test tests/saucedemo-visual-regression.spec.ts --update-snapshots --project=desktop-chrome --project=mobile-chrome --project=desktop-safari

      # -----------------------------------------------------------------------
      # ステップ4: 【コマンド実行時】更新されたスナップショット画像の Git Commit & Push
      # -----------------------------------------------------------------------
      - name: Commit & Push updated snapshots
        if: "contains(github.event.comment.body, '/update-vrt')"
        id: commit-vrt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A tests/
          if ! git diff --staged --quiet; then
            git commit -m "chore(vrt): PC/スマホ/Safari全環境のVRTベースライン画像を自動更新 [skip ci]"
            git push
            NEW_SHA=$(git rev-parse HEAD)
            echo "commit_sha=${NEW_SHA}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No snapshot changes to commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # ステップ5: HTMLテストレポートの GitHub Pages デプロイ
      # -----------------------------------------------------------------------
      - name: Check Playwright Report Directory
        id: check-report
        run: |
          if [ -d "./playwright-report" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Playwright Report to GitHub Pages
        if: "always() && steps.check-report.outputs.exists == 'true' && !contains(github.event.comment.body, '/update-vrt')"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: pr-reports/${{ steps.pr-branch.outputs.result }}
          keep_files: true

      # -----------------------------------------------------------------------
      # ステップ6: PR画面への結果フィードバックコメント投稿
      # -----------------------------------------------------------------------
      - name: Comment PR Status or VRT Reply
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const isVrtCommand = context.eventName === 'issue_comment' && context.payload.comment.body.includes('/update-vrt');
            const issueNumber = context.issue.number;

            if (isVrtCommand) {
              const isSuccess = '${{ job.status }}' === 'success';
              const hasChanges = '${{ steps.commit-vrt.outputs.has_changes }}' === 'true';
              const commitSha = '${{ steps.commit-vrt.outputs.commit_sha }}';
              let replyBody = '';

              if (isSuccess) {
                if (hasChanges) {
                  const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha}`;
                  replyBody = `📸 **PC・スマホ・Safari環境の VRT Snapshots を自動更新しました！**\n\n` +
                              `🔗 **画像の更新差分:** [コミット結果を表示 (${commitSha.substring(0, 7)})](${commitUrl})\n\n` +
                              `最新の画像をブランチにコミット＆Pushしました。再テストの完了をお待ちください。`;
                } else {
                  replyBody = `ℹ️ **VRT Snapshots に変更差分はありませんでした。**\n既存の画像と完全に一致しています。`;
                }
              } else {
                replyBody = `❌ **VRT Snapshots の自動更新に失敗しました。**\nActions ログをご確認ください。`;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: replyBody
              });
            } else {
              const status = '${{ steps.run-tests.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED';
              const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-reports/${encodeURIComponent('${{ steps.pr-branch.outputs.result }}')}/`;
              const body = `### 🎭 Playwright Test Results (PR Check)\n` +
                           `**Status:** ${status}\n` +
                           `**PR Branch:** \`${'${{ steps.pr-branch.outputs.result }}'}\` \n` +
                           `**📊 HTML Report:** [View Test Report](${reportUrl})\n\n` +
                           `---\n` +
                           `📸 **VRT画像を更新したい場合:**\n` +
                           `コメント欄に \`/update-vrt\` と投稿すると、Linux環境の全環境最新画像を自動更新してPushします。`;

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              const botComment = comments.find(c => c.body.includes('Playwright Test Results'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body
                });
              }
            }

      # -----------------------------------------------------------------------
      # ステップ7: テスト結果（HTMLレポート）のアーティファクト保存
      # -----------------------------------------------------------------------
      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-playwright-report
          path: playwright-report/
          retention-days: 7