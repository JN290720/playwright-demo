name: PR Test

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write # レポート用およびVRT画像Push用に write
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # 💡 自動コミット後の Push をPRブランチに正確に行うため ref を指定
        ref: ${{ github.event.pull_request.head.ref }}

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    # ------------------------------------------------------------------
    # 💡 [一時追加] 初回Linux用ベースライン画像の生成＆コミット処理
    # ------------------------------------------------------------------
    - name: Generate VRT Baseline Images
      env:
        ENV: staging
      run: npx playwright test tests/saucedemo-visual-regression.spec.ts --update-snapshots

    - name: Commit and Push Updated Snapshots
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add tests/saucedemo-visual-regression.spec.ts-snapshots/
        if ! git diff --staged --quiet; then
          git commit -m "chore(vrt): Linux環境向けベースライン画像の初回自動生成"
          git push
        else
          echo "No snapshot changes to commit."
        fi
    # ------------------------------------------------------------------

    # 💡 通常の全テスト判定（画像生成後に実行）
    - name: Run Playwright tests
      id: run-tests
      env:
        ENV: staging
      run: npx playwright test

    # テスト結果（HTMLレポート）を GitHub Pages (gh-pages ブランチ) へ自動デプロイ
    - name: Deploy Playwright Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: pr-reports/${{ github.event.number }}

    # PR画面へのテスト結果自動コメント
    - name: Comment PR with Test Status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ steps.run-tests.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED';
          const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-reports/${context.issue.number}/`;
          
          const body = `### 🎭 Playwright Test Results (PR Check)\n` +
                       `**Status:** ${status}\n` +
                       `**PR Branch:** \`${context.payload.pull_request.head.ref}\` \n` +
                       `**📊 HTML Report:** [View Test Report](${reportUrl})`;
          
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.find(c => c.body.includes('Playwright Test Results'));
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id, body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: body
            });
          }

    # テスト結果（HTMLレポート）の保存
    - name: Upload Playwright Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pr-playwright-report
        path: playwright-report/
        retention-days: 7