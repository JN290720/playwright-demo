name: Update VRT Snapshots (Linux)

on:
  # 💡 手動実行（Actionsタブから「Run workflow」）のみ
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Update VRT Baseline Images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run VRT tests only with --update-snapshots
      # 💡 visual-regression のテストファイルだけを指定して画像更新を実行
      run: npx playwright test tests/saucedemo-visual-regression.spec.ts --update-snapshots
      env:
        ENV_NAME: staging
        BASE_URL: https://www.saucedemo.com

    - name: Commit & Push updated snapshots
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add tests/saucedemo-visual-regression.spec.ts-snapshots/
        if ! git diff --staged --quiet; then
          git commit -m "chore(vrt): Linux環境向けのVRTベースライン画像を更新"
          git push
        else
          echo "更新された画像差分はありませんでした。"
        fi