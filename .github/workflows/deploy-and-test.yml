name: Deploy & Post-Deploy Test

on:
  push:
    branches: [ main, master ] # mainにマージされた時のみ発火（PR時は動かない）

permissions:
  contents: write # 💡 レポート用gh-pages更新のために write に変更
  pages: write
  id-token: write

jobs:
  # STEP 1: GitHub Pages へデプロイ
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: '.' 
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # STEP 2: デプロイ完了後、実際に公開された URL に対して Playwright を実行
  post-deploy-test:
    needs: deploy
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests against deployed site
      env:
        BASE_URL: ${{ needs.deploy.outputs.page_url }}
      run: npx playwright test

    # 💡 1. 過去ログ用（実行ID別フォルダ）への蓄積保存
    # keep_files: true で過去の実行結果を削除せずに残します
    - name: Deploy Historical Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: main-test-${{ github.run_id }}
        keep_files: true

    # 💡 2. 最新用（固定フォルダ main-deploy-report）への上書き更新
    # keep_files: true を併用することで、他のフォルダ（main-test-*）を消さずに最新レポートのみ上書きします
    - name: Deploy Latest Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: main-deploy-report
        keep_files: true

    # 💡 ワークフローの「Summary（概要）」画面およびログに最新＆今回の固有URLを両方出力
    - name: Output Report URL to Summary & Log
      if: always()
      run: |
        # 1. 従来のログ（Console Output）への出力
        echo "======================================================="
        echo "🎭 Latest Test Report URL:"
        echo "${{ needs.deploy.outputs.page_url }}main-deploy-report/"
        echo "🎭 Run #${{ github.run_id }} Test Report URL:"
        echo "${{ needs.deploy.outputs.page_url }}main-test-${{ github.run_id }}/"
        echo "======================================================="

        # 2. Actions 実行結果画面の Summary へ出力
        echo "## 🎭 Playwright Test Reports" >> $GITHUB_STEP_SUMMARY
        echo "🌟 **[最新のテストレポートを見る（ブックマーク用）](${{ needs.deploy.outputs.page_url }}main-deploy-report/)**" >> $GITHUB_STEP_SUMMARY
        echo "📜 **[今回の実行結果のみ見る (#${{ github.run_id }})](${{ needs.deploy.outputs.page_url }}main-test-${{ github.run_id }}/)**" >> $GITHUB_STEP_SUMMARY

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: post-deploy-playwright-report
        path: playwright-report/
        retention-days: 7