name: Deploy & Post-Deploy Test

on:
  push:
    branches: [ main, master ] # mainにマージされた時のみ発火（PR時は動かない）

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # STEP 1: GitHub Pages へデプロイ
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v3
      with:
        path: '.' 
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  # STEP 2: デプロイ完了後、実際に公開された URL に対して Playwright を実行
  post-deploy-test:
    needs: deploy
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests against deployed site
      env:
        BASE_URL: ${{ needs.deploy.outputs.page_url }}
      run: npx playwright test

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: post-deploy-playwright-report
        path: playwright-report/
        retention-days: 7