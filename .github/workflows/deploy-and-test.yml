name: Deploy & Post-Deploy Test

on:
  push:
    branches: [ main, master ] # mainにマージされた時のみ発火（PR時は動かない）

permissions:
  contents: write # 💡 レポート用gh-pages更新のために write に変更
  pages: write
  id-token: write

jobs:
  # STEP 1: GitHub Pages へデプロイ
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: '.' 
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # STEP 2: デプロイ完了後、実際に公開された URL に対して Playwright を実行
  post-deploy-test:
    needs: deploy
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests against deployed site
      env:
        BASE_URL: ${{ needs.deploy.outputs.page_url }}
      run: npx playwright test

    # 💡 [追加] テスト結果（HTMLレポート）を GitHub Pages (gh-pages ブランチ) へ自動デプロイ
    # 成功・失敗を問わず常に実行され、ブラウザからURL直叩きでレポートを直接閲覧できるようにします
    - name: Deploy Playwright Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: main-deploy-report # mainブランチの最新本番テストレポートとして保存

    # 💡 [追加] 実行完了時のコンソールログにレポート閲覧用URLを出力
    # Actionsのビルドログ（Console Output）からワンクリックでテスト結果へアクセスできます
    - name: Output Report URL to Log
      if: always()
      run: |
        echo "======================================================="
        echo "🎭 Post-Deploy Playwright Test Report URL:"
        echo "${{ needs.deploy.outputs.page_url }}main-deploy-report/"
        echo "======================================================="

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: post-deploy-playwright-report
        path: playwright-report/
        retention-days: 7