name: Deploy & Post-Deploy Test

on:
  push:
    branches: [ main, master ] # mainにマージされた時のみ発火（PR時は動かない）

permissions:
  contents: write # 💡 レポート用gh-pages更新のために write に変更
  pages: write
  id-token: write

jobs:
  # STEP 1: GitHub Pages へデプロイ
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v3
      with:
        path: '.' 
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

  # STEP 2: デプロイ完了後、実際に公開された URL に対して Playwright を実行
  post-deploy-test:
    needs: deploy
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests against deployed site
      env:
        BASE_URL: ${{ needs.deploy.outputs.page_url }}
      run: npx playwright test

    # 💡 [修正] 実行ID（run_id）ごとの専用フォルダにレポートを自動デプロイ
    # keep_files: true を追加することで、過去のテストレポートを削除せず残せます
    - name: Deploy Playwright Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        destination_dir: main-test-${{ github.run_id }} # 👈 実行IDごとの固有フォルダ（例: main-test-12345678）
        keep_files: true # 👈 過去のテスト結果を消さずに残す設定

    # 💡 [変更] ワークフローの「Summary（概要）」画面およびログにレポート閲覧用URLを出力
    - name: Output Report URL to Summary & Log
      if: always()
      run: |
        # 1. 従来のログ（Console Output）への出力
        echo "======================================================="
        echo "🎭 Post-Deploy Playwright Test Report URL (Run #${{ github.run_id }}):"
        echo "${{ needs.deploy.outputs.page_url }}main-test-${{ github.run_id }}/"
        echo "======================================================="

        # 2. 💡 Actions 実行結果画面の Summary へ出力
        echo "## 🎭 Playwright Test Report" >> $GITHUB_STEP_SUMMARY
        echo "**Run ID:** \`#${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
        echo "📊 **[View Post-Deploy Test Report](${{ needs.deploy.outputs.page_url }}main-test-${{ github.run_id }}/)**" >> $GITHUB_STEP_SUMMARY

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: post-deploy-playwright-report
        path: playwright-report/
        retention-days: 7