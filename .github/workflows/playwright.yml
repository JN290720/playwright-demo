name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write # PRコメント作成用の権限

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      id: test
      run: npx playwright test
      continue-on-error: true

    # PRの場合のみ、テスト結果のサマリーをGitHubのPRコメントに投稿
    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const outcome = '${{ steps.test.outcome }}';
          const body = `### 🎭 Playwright Test Results
          - **Status**: ${outcome === 'success' ? '✅ PASSED' : '❌ FAILED'}
          - **PR Branch**: \`${process.env.GITHUB_HEAD_REF}\``;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    # mainブランチの場合のみGitHub Pages用の準備を実行
    - name: Setup Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4

    # テストが成功しても失敗しても、常にレポートを Artifacts に保存する
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4 # ※upload-pages-artifact ではなく通常の upload-artifact を使用
      with:
        name: playwright-report
        path: 'playwright-report/'
        retention-days: 7 # 保存期間（7日間）

  # mainブランチの場合のみGitHub Pagesへデプロイ
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4