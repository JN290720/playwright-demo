name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write # PRへのコメント投稿に必要な権限

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run Playwright tests
      id: run-tests
      run: npx playwright test

    # PR時にテスト結果のコメントを自動投稿するステップ
    - name: Comment PR with Test Status
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v8
      with:
        script: |
          const status = '${{ steps.run-tests.outcome }}' === 'success' ? '✅ PASSED' : '❌ FAILED';
          const body = `### 🎭 Playwright Test Results\n**Status:** ${status}\n**PR Branch:** \`${context.payload.pull_request.head.ref}\``;
          
          // 既存のコメントを探して更新、なければ新規作成
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const botComment = comments.find(c => c.body.includes('Playwright Test Results'));
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

    # ① 手動ダウンロード用のレポート保存（成功・失敗問わず常に実行）
    - name: Upload Playwright Report Artifact
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    # ② GitHub Pages デプロイ専用のアーティファクト作成（mainブランチかつテスト成功時のみ）
    - name: Upload Pages Artifact
      if: github.ref == 'refs/heads/main' && success()
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/

  deploy:
    # mainブランチかつ test ジョブが成功したときだけ実行
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4