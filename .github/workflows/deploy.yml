name: Deploy App

on:
  push:
    branches: [ main ]

# 最小権限: 公開は行わないため、読み取りのみ（#2a。Pages の artifact 配信を外した）
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 💡 この job は、公開を行わない。Post-Deploy Test（test.yml）は、この workflow の成功を
    #    トリガーにするため、名前と成功の条件を残している。公開（レポート）は test.yml が gh-pages に行う
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
